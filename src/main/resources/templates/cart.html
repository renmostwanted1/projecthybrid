<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your Bag | Project Hybrid</title><link rel="stylesheet" href="/style.css"></head><body><header class="nav"><a class="brand" href="/">PROJECT <b>HYBRID</b></a><nav><a href="/">Continue shopping</a><a href="/admin/products">Manage Products</a></nav></header><main class="admin-wrap"><p class="eyebrow">YOUR SELECTION</p><h1>Your bag<span class="lime-dot">.</span></h1><div th:if="${lines.isEmpty()}" class="empty"><h3>Your bag is empty.</h3><a class="btn lime" href="/">EXPLORE PRODUCTS</a></div><div th:if="${!lines.isEmpty()}" class="cart-lines"><div class="cart-row" th:each="line : ${lines}"><img th:src="${line.product.imageUrl}" th:alt="${line.product.name}"><div class="cart-desc"><h3 th:text="${line.product.name}"></h3><p th:text="'Qty: ' + ${line.quantity}"></p></div><strong th:text="'₱' + ${#numbers.formatDecimal(line.subtotal,1,2)}"></strong><form th:action="@{/cart/remove/{id}(id=${line.product.id})}" method="post"><button class="remove">REMOVE</button></form></div><div class="total-row"><span>Subtotal</span><strong th:text="'₱' + ${#numbers.formatDecimal(total,1,2)}"></strong></div><p class="muted">Shipping fees are confirmed by the store before fulfillment.</p><a class="btn lime" href="/checkout">PROCEED TO CHECKOUT →</a></div></main><footer><a class="brand" href="/">PROJECT <b>HYBRID</b></a><span>Project Hybrid Store</span></footer></body></html>
