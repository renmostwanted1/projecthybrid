<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout | Project Hybrid</title><link rel="stylesheet" href="/style.css"></head><body><header class="nav"><a class="brand" href="/">PROJECT <b>HYBRID</b></a><nav><a href="/cart">← Back to bag</a></nav></header><main class="admin-wrap checkout-wrap"><p class="eyebrow">ALMOST YOURS</p><h1>Checkout<span class="lime-dot">.</span></h1><div th:if="${error}" class="error" th:text="${error}"></div><div class="checkout-grid"><form class="admin-form checkout-form" th:action="@{/checkout}" method="post"><label>Full name<input name="customerName" required></label><label>Email address<input name="email" type="email" required></label><label>Phone number<input name="phone" type="tel" required></label><label class="wide">Shipping address<textarea name="shippingAddress" rows="3" required></textarea></label><button class="btn lime wide">PLACE ORDER</button><p class="muted wide">Demo checkout: this records the order in the database. No payment is collected.</p></form><aside class="order-summary"><p class="eyebrow">ORDER TOTAL</p><h2 th:text="'₱' + ${#numbers.formatDecimal(total,1,2)}">₱0.00</h2><p>Payment and delivery will need to be confirmed with the store.</p></aside></div></main><footer><a class="brand" href="/">PROJECT <b>HYBRID</b></a><span>Secure checkout must be configured before launch.</span></footer></body></html>
