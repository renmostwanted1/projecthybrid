spring.application.name=Project Hybrid Store
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/project_hybrid_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.thymeleaf.cache=false

# LOCAL DEVELOPMENT ONLY: change these before deploying. Prefer environment variables in production.
store.admin.username=${STORE_ADMIN_USERNAME:admin}
store.admin.password=${STORE_ADMIN_PASSWORD:ChangeThisBeforeLaunch123!}
