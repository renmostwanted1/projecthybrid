<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product Manager | Project Hybrid</title><link rel="stylesheet" href="/style.css"></head><body><header class="nav"><a class="brand" href="/">PROJECT <b>HYBRID</b></a><nav><a href="/">Storefront</a><a href="/cart">Bag</a><form th:action="@{/logout}" method="post" style="display:inline"><button class="remove" type="submit">LOG OUT</button></form></nav></header><main class="admin-wrap"><p class="eyebrow">STORE CONTROL</p><h1>Product manager<span class="lime-dot">.</span></h1><p class="muted">Add products to the catalog. This demo page is not protected; secure it before public deployment.</p><div th:if="${message}" class="notice" th:text="${message}"></div><div th:if="${error}" class="error" th:text="${error}"></div>
<form class="admin-form" th:action="@{/admin/products}" method="post"><label>Product name<input name="name" required placeholder="Hybrid Training Tee"></label><label>Category<input name="category" required placeholder="Apparel / Accessories"></label><label>Price (PHP)<input name="price" type="number" min="0" step="0.01" required placeholder="899.00"></label><label>Stock quantity<input name="stock" type="number" min="0" required value="10"></label><label class="wide">Image URL<input name="imageUrl" type="url" placeholder="https://..."></label><label class="wide">Description<textarea name="description" rows="3" placeholder="Product details..."></textarea></label><button class="btn lime wide">SAVE PRODUCT +</button></form>
<h2 class="table-title">Current catalog</h2><div class="table-scroll"><table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="p : ${products}"><td th:text="${p.name}"></td><td th:text="${p.category}"></td><td th:text="'₱' + ${#numbers.formatDecimal(p.price,1,2)}"></td><td th:text="${p.stock}"></td><td th:text="${p.active ? 'Active' : 'Hidden'}"></td><td><form th:if="${p.active}" th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post"><button class="remove">HIDE</button></form></td></tr></tbody></table></div></main><footer><a class="brand" href="/">PROJECT <b>HYBRID</b></a><span>Store administration</span></footer></body></html>
